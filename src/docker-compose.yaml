services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: autoparts-sql
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SuaSenha@123"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SuaSenha@123' -No -Q 'SELECT 1' || exit 1"
      ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  seq:
    image: datalust/seq:2025.2
    container_name: autoparts-seq
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINUSERNAME: "admin"
      SEQ_FIRSTRUN_ADMINPASSWORD: "Admin@123456"

    ports:
      - "5341:80"

    volumes:
      - seq_data:/data

    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sql_data:
  seq_data: